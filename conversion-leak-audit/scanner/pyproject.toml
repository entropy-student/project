[project]
name = "conversion-leak-audit-scanner"
version = "0.1.0"
description = "Bounded public-site fact scanner for Conversion Leak Audit"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn>=0.48,<1",
  "pydantic>=2.13,<3",
  "lxml>=6,<7",
  "Scrapy==2.19.0",
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
