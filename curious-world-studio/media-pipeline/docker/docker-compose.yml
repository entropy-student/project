services:
  valkey:
    image: docker.io/valkey/valkey@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    pull_policy: never
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  searxng:
    image: docker.io/searxng/searxng@sha256:ddd642cae6eac75412938fd846ddbf440a2df029cfeae8a562b8b205f4e35e25
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?generated in ignored local runtime.env}
      SEARXNG_BASE_URL: http://127.0.0.1:18080/
      SEARXNG_LIMITER: "false"
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
      HTTP_PROXY: ${CWS_DOCKER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CWS_DOCKER_HTTP_PROXY:-}
      http_proxy: ${CWS_DOCKER_HTTP_PROXY:-}
      https_proxy: ${CWS_DOCKER_HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,valkey,host.docker.internal
      no_proxy: localhost,127.0.0.1,valkey,host.docker.internal
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      valkey:
        condition: service_healthy
  fourget:
    image: docker.io/luuul/4get@sha256:a42c215ffed9fb9884c55f864f40a50a1651bc27b9d1213be2d090977c881612
    pull_policy: never
    restart: "no"
    ports:
      - "127.0.0.1:15050:80"
    environment:
      FOURGET_PROTO: http
      FOURGET_SERVER_NAME: 127.0.0.1
      HTTP_PROXY: ${CWS_DOCKER_HTTP_PROXY:-}
      HTTPS_PROXY: ${CWS_DOCKER_HTTP_PROXY:-}
      http_proxy: ${CWS_DOCKER_HTTP_PROXY:-}
      https_proxy: ${CWS_DOCKER_HTTP_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
      no_proxy: localhost,127.0.0.1,host.docker.internal
    mem_limit: 512m
    cpus: 0.5
volumes:
  searxng-cache:
