function sceneIndex(sec){if(sec<INTRO||sec>=CONTENT_END)return -1;return scenes.findIndex(s=>sec>=s.start-1e-5&&sec<s.end-1e-5)}
function stagesFor(s){return s.stages||Array.from({length:3},(_,i)=>({label:['阶段一','阶段二','阶段三'][i],name:['阶段一','阶段二','阶段三'][i],duration:s.duration/3,inPoint:0}));}
function stageAt(s,sec){const parts=stagesFor(s);let elapsed=Math.max(0,Math.min(s.duration,sec-s.start)),offset=0;
 for(let i=0;i<parts.length;i++){const d=parts[i].duration;if(elapsed<offset+d||i===parts.length-1)return{index:i,elapsed:Math.max(0,Math.min(elapsed-offset,d)),start:s.start+offset,duration:d,inPoint:Number(parts[i].inPoint||0)};offset+=d;}
 throw Error('Invalid T5 stages '+s.id);
}
function getStep(s,sec){return s.template==='T5'?stageAt(s,sec).index:0;}

const getShot=(sec)=>sec<INTRO?0:sec>=CONTENT_END?scenes.length-1:sceneIndex(sec);
$('seek').max=String(END);
function clock(s){const n=Math.floor(Math.max(0,s));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function captionTooWide(sentence){const ctx=document.createElement('canvas').getContext('2d');ctx.font='700 55px Microsoft YaHei, Arial, sans-serif';return ctx.measureText(sentence).width>1680;}
function captionHealth(){const invalid=scenes.filter(x=>captionTooWide(x.caption));const warning=$('captionWarning');warning.textContent=invalid.length?'字幕过长：'+invalid.map(s=>s.id).join('、')+'；无法完整显示为单行，请拆句后再用于正式视频。':'';warning.hidden=!invalid.length;return invalid.length===0;}
function textUpdate(){const s=scenes[Math.max(0,idx)];$('shot-title').textContent=s.title;$('source-badge').textContent=s.label;$('subtitle').textContent=s.caption;captionHealth();}
function content(time,force=false){
 const i=getShot(time),s=scenes[i],stageInfo=s.template==='T5'?stageAt(s,time):null,stage=stageInfo?.index||0;
 if(i!==idx||stage!==step||force){
  for(const x of videoNodes)x.pause();idx=i;step=stage;
  $('shot-holder').replaceChildren(TEMPLATE_RENDERERS[s.template](s,stage));videoNodes=[...$('shot-holder').querySelectorAll('video')];textUpdate();
 }
 for(const vid of videoNodes){
  const slot=Number(vid.dataset.slot||0),option=slotOptions(s,slot),inPoint=stageInfo?(stageInfo.inPoint||0):Number(option.inPoint||0);
  const local=stageInfo?stageInfo.elapsed:Math.max(0,time-s.start);
  const duration=Number.isFinite(vid.duration)&&vid.duration>0?vid.duration:null;
  const looping=option.endBehavior==='loop';
  const logical=Math.max(0,local+inPoint);
  const atEnd=duration!==null&&!looping&&logical>=Math.max(0,duration-.045);
  const target=duration===null?logical:looping?(logical%duration):Math.min(logical,Math.max(0,duration-.055));
  if(!playing||time<INTRO||time>=CONTENT_END||atEnd){
   vid.pause();if(duration!==null&&Math.abs(vid.currentTime-target)>.04)try{vid.currentTime=target}catch{}
  }else{
   if(duration!==null&&Math.abs(vid.currentTime-target)>.35)try{vid.currentTime=target}catch{}
   if(vid.paused&&vid.readyState>=1)vid.play().catch(()=>{});
  }
 }
}

function draw(time){
 window.__CWS_PLAYER_ACTIVE=playing;
 window.renderAt(time);
 const g=window.__cwsWindowGeom(time),vp=$('content-viewport');
 if(!g||g.w<160||g.h<150){vp.style.visibility='hidden';return}
 const innerH=Math.max(0,g.h-63-(g.full?70:68));
 vp.style.visibility='visible';vp.style.opacity=String(Math.max(0,g.a));
 vp.style.left=(g.x/1920*100)+'%';vp.style.top=((g.y+63)/1080*100)+'%';
 vp.style.width=(g.w/1920*100)+'%';vp.style.height=(innerH/1080*100)+'%';
 const pixelsPerUnit=$('stageframe').clientWidth/1920;
 $('content-plane').style.transform='scale('+(pixelsPerUnit*g.w/1920)+','+(pixelsPerUnit*innerH/947)+')';
}
function render(sec,force=false){t=Math.min(END,Math.max(0,sec));content(t,force);draw(t);$('seek').value=t;$('outtime').textContent=clock(t)+' / '+clock(END);
 [...$('tabs').children].forEach((b,i)=>b.classList.toggle('active',i===idx));}
function toggle(){if(t>=END)render(0,true);playing=!playing;last=0;$('play').textContent=playing?'Ⅱ 暂停':'▶ 播放完整样片';if(!playing)videoNodes.forEach(x=>x.pause());render(t)}
function tick(now){if(playing){if(last)t=Math.min(END,t+(now-last)/1000);last=now;if(t>=END){playing=false;last=0;$('play').textContent='▶ 播放完整样片'}render(t)}requestAnimationFrame(tick)}
function choose(i){selectedIndex=i;const s=scenes[i];$('ed-title').textContent=s.id+' · '+s.template+' '+TEMPLATES[s.template].name;$('captionEdit').value=s.caption;$('titleEdit').value=s.title;$('sourceLabelEdit').value=s.label;const slot=$('slots');slot.replaceChildren();
s.assets.forEach((x,k)=>{const wrap=safeEl('div','slot-row'),lab=safeEl('span'),input=safeEl('input');lab.textContent='槽位 '+(k+1)+'：'+(imported.get(mediaKey(s,k))?.name||'尚未选择');input.type='file';input.accept='image/png,image/jpeg,image/webp,video/mp4,video/webm';
input.addEventListener('change',()=>{const f=input.files?.[0];if(!f||!(/^(image\/(png|jpeg|webp)|video\/(mp4|webm))$/).test(f.type))return;const key=mediaKey(s,k),prev=imported.get(key);if(prev)URL.revokeObjectURL(prev.url);imported.set(key,{url:URL.createObjectURL(f),type:f.type,name:f.name});lab.textContent='槽位 '+(k+1)+'：'+f.name;render(t,true)});wrap.append(lab,input);slot.append(wrap);});}
for(let i=0;i<scenes.length;i++){let b=safeEl('button'),s=scenes[i];b.textContent=s.id+' · '+s.template+' '+TEMPLATES[s.template].name;b.addEventListener('click',()=>{playing=false;last=0;render(s.start,true);choose(i);$('play').textContent='▶ 播放完整样片'});$('tabs').append(b)}
$('play').addEventListener('click',toggle);$('restart').addEventListener('click',()=>{playing=false;last=0;render(0,true);$('play').textContent='▶ 播放完整样片'});
$('seek').addEventListener('input',e=>{playing=false;last=0;render(Number(e.target.value),true);$('play').textContent='▶ 播放完整样片'});
$('fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)$('stageframe').requestFullscreen?.();else document.exitFullscreen?.()});
$('export').addEventListener('click',()=>{if(!captionHealth()){alert('部分字幕超出单行显示宽度，请先拆句，再导出。');return;}
 let o={schema:'CWS_V53_REVIEW_CANDIDATE',upstream:'acb0ee80264527bd11160e0ae277ce24528c4a03',fileName:FILM_CONFIG.fileName,globalClock:END,scenes:scenes.map(s=>({id:s.id,template:s.template,start:s.start,end:s.end,title:s.title,caption:s.caption,label:s.label,stages:s.stages||null,dataMetrics:s.dataMetrics||null,dataScaleMax:s.dataScaleMax||null,dataNote:s.dataNote||null,assetOptions:s.assetOptions||null,files:s.assets.map((x,i)=>imported.get(mediaKey(s,i))?.name||null)}))};let url=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'})),a=safeEl('a');a.href=url;a.download='CWS_V5_scene_manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
// The original QuickTime controls live on Canvas: relay click targets to the one master timeline.
$('view').addEventListener('click',e=>{
 const r=$('view').getBoundingClientRect(),cx=(e.clientX-r.left)*1920/r.width,cy=(e.clientY-r.top)*1080/r.height;
 if(t<3.75 || t>=END)return;
 if(cy>=1009&&cy<=1080){
   if(cx>=270&&cx<=1580){const fraction=Math.max(0,Math.min(1,(cx-288)/1248));playing=false;last=0;render(fraction*END,true);$('play').textContent='▶ 播放完整样片';return}
   if(cx<125){toggle();return}
 }
 if(cx<=100&&cy<=65&&t>=CONTENT_END-0.5){playing=true;last=0;render(Math.max(t,CONTENT_END));$('play').textContent='Ⅱ 暂停'}
});
document.addEventListener('keydown',e=>{if(e.target.closest('input'))return;
 if(e.code==='Space'){e.preventDefault();toggle()}
 if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();playing=false;last=0;render(Math.max(0,Math.min(END,t+(e.code==='ArrowRight'?5:-5))),true);$('play').textContent='▶ 播放完整样片'}
});
$('fileNameEdit').addEventListener('input',e=>{FILM_CONFIG.fileName=e.target.value.trim()||'QUESTION_01.mov';render(t)});
$('sourceLabelEdit').addEventListener('input',e=>{scenes[selectedIndex].label=e.target.value;if(idx===selectedIndex)textUpdate()});
$('captionEdit').addEventListener('input',e=>{scenes[selectedIndex].caption=e.target.value;if(idx===selectedIndex)textUpdate();captionHealth()});
$('titleEdit').addEventListener('input',e=>{scenes[selectedIndex].title=e.target.value;if(idx===selectedIndex)textUpdate()});
$('fileNameEdit').value=FILM_CONFIG.fileName;choose(0);render(0,true);requestAnimationFrame(tick);
window.__CWS_SEEK=(x)=>{playing=false;last=0;render(x,true)};
window.__CWS_SOURCE='GITHUB_V5_REVIEW_PATCH_V52';
window.__CWS_DEBUG=()=>({time:t,playing,shot:scenes[idx]?.id,template:scenes[idx]?.template,step,oneOriginalCanvas:document.querySelectorAll('canvas#view').length,secondMacWindow:!!document.getElementById('qt'),end:END});
})();
</script></body></html>
