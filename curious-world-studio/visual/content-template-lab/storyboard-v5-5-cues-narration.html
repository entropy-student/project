function sceneIndex(sec){if(sec<INTRO||sec>=CONTENT_END)return -1;return scenes.findIndex(s=>sec>=s.start-1e-5&&sec<s.end-1e-5)}

 for(let i=0;i<parts.length;i++){const d=parts[i].duration;if(elapsed<offset+d||i===parts.length-1)return{index:i,elapsed:Math.max(0,Math.min(elapsed-offset,d)),start:s.start+offset,duration:d,inPoint:Number(parts[i].inPoint||0)};offset+=d;}

}

function content(time,force=false){
 const i=getShot(time),s=scenes[i],stageInfo=s.template==='T5'?stageAt(s,time):null,stage=stageInfo?.index||0;
 if(i!==idx||stage!==step||force){
  for(const x of videoNodes)x.pause();idx=i;step=stage;
  $('shot-holder').replaceChildren(TEMPLATE_RENDERERS[s.template](s,stage));videoNodes=[...$('shot-holder').querySelectorAll('video')];textUpdate();
 }
 for(const vid of videoNodes){
  const slot=Number(vid.dataset.slot||0),option=slotOptions(s,slot),inPoint=stageInfo?(stageInfo.inPoint||0):Number(option.inPoint||0);
  const local=stageInfo?stageInfo.elapsed:Math.max(0,time-s.start);
  const duration=Number.isFinite(vid.duration)&&vid.duration>0?vid.duration:null;
  const looping=option.endBehavior==='loop';
  const logical=Math.max(0,local+inPoint);
  const atEnd=duration!==null&&!looping&&logical>=Math.max(0,duration-.045);
  const target=duration===null?logical:looping?(logical%duration):Math.min(logical,Math.max(0,duration-.055));
  if(!playing||time<INTRO||time>=CONTENT_END||atEnd){
   vid.pause();if(duration!==null&&Math.abs(vid.currentTime-target)>.04)try{vid.currentTime=target}catch{}
  }else{
   if(duration!==null&&Math.abs(vid.currentTime-target)>.35)try{vid.currentTime=target}catch{}
   if(vid.paused&&vid.readyState>=1)vid.play().catch(()=>{});
  }

}

function draw(time){

 if(!g||g.w<160||g.h<150){vp.style.visibility='hidden';return}

 if(a.getAttribute('src')!==item.url){a.pause();a.src=item.url;a.load();}
 const active=t>=TRACK_CONFIG.startAt&&t<CONTENT_END,desired=Math.max(0,t-TRACK_CONFIG.startAt),ready=a.readyState>=1&&Number.isFinite(a.duration)&&a.duration>0;

  } else if(s.stages!==undefined)throw Error(id+'不应具有stages');
  if(s.template==='T6'){
   if(!Array.isArray(s.dataMetrics)||s.dataMetrics.length<2||s.dataMetrics.length>8)throw Error(id+'dataMetrics须2~8项');
   shot.dataMetrics=s.dataMetrics.map(m=>{dataShape(m,'metric');checkAllowed(m,['label','value','unit'],'metric');return {label:checkedStr(m.label,90,'指标名'),value:positive(m.value,'指标数值',true),unit:checkedStr(m.unit,20,'单位',{empty:true})}});
   shot.dataScaleMax=positive(s.dataScaleMax??Math.max(1,...shot.dataMetrics.map(m=>m.value)),'比例基准');
   shot.dataNote=checkedStr(s.dataNote??'',240,'数据注释',{empty:true});
  } else if(s.dataMetrics!==undefined||s.dataScaleMax!==undefined||s.dataNote!==undefined)throw Error(id+'不是T6却包含数据字段');
  if(s.compareLabels!==undefined){if(s.template!=='T2'||!Array.isArray(s.compareLabels)||s.compareLabels.length!==2)throw Error(id+'比较标签仅支持T2两个');shot.compareLabels=s.compareLabels.map(x=>checkedStr(x,50,'比较标签'))}
  shots.push(shot);
 }
 const expected=total+OUTRO;
 if(!Number.isFinite(time.total)||Math.abs(time.total-expected)>.001)throw Error('timeline.total与镜头时长不一致');
 if(narration&&narration.startAt>=total)throw Error('旁白开始时间必须在内容结束前');
 const referenced=new Set(shots.flatMap(s=>s.assets));for(const id of reg.keys())if(!referenced.has(id)&&id!==narration?.assetId)throw Error('存在未被任何镜头引用的素材登记：'+id);
 return {fileName,shots,registry:reg,total:expected,narration,legacy};
}
function doImport(raw){
 // Atomic commit: reject all invalid content without altering current timeline or media.
 const normalized=validateStory(raw),compiled=compileTimeline(normalized.shots),ended=compiled.at(-1).end+OUTRO;
 if(Math.abs(ended-normalized.total)>.001)throw Error('导入后的时间轴总长不一致');
 stopNarration(true);for(const a of imported.values())URL.revokeObjectURL(a.url);
 imported.clear();assetRegistry=normalized.registry;scenes=compiled;CONTENT_END=compiled.at(-1).end;END=ended;
 FILM_CONFIG.fileName=normalized.fileName;TRACK_CONFIG.assetId=normalized.narration?.assetId||null;TRACK_CONFIG.startAt=normalized.narration?.startAt??INTRO;window.__CWS_TIMELINE={contentEnd:CONTENT_END,end:END,closeDone:CONTENT_END+2.04};window.__duration=END;
 t=0;playing=false;last=0;idx=-1;step=-1;selectedIndex=0;videoNodes.forEach(v=>v.pause());videoNodes=[];
 $('fileNameEdit').value=FILM_CONFIG.fileName;$('narrationStart').value=String(TRACK_CONFIG.startAt);$('seek').max=String(END);$('play').textContent='▶ 播放完整样片';
 rebuildTabs();choose(0);render(0,true);refreshAssetStatus();refreshNarrationStatus();
 setStatus((normalized.legacy?'旧版V1已自动转换为分段字幕。':'')+'导入成功：'+scenes.length+'镜头，'+assetRegistry.size+'个素材登记；文件内容未随JSON导入，请按ID重新选择本地媒体。');
}
function exportStory(){if(!captionHealth()){setStatus('存在过长单行字幕，无法导出。请先拆短字幕。',true);return false;}
 const spec=storyboard();validateStory(spec);let url=URL.createObjectURL(new Blob([JSON.stringify(spec,null,2)],{type:'application/json'})),a=safeEl('a');a.href=url;a.download='CWS_STORYBOARD_V1.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 setStatus('JSON已导出：'+scenes.length+'镜头，'+assetRegistry.size+'个素材ID。文件实体不包含在JSON中。');return true;}
$('export').addEventListener('click',exportStory);
$('importTrigger').addEventListener('click',()=>$('importJSON').click());
$('importJSON').addEventListener('change',async()=>{const file=$('importJSON').files?.[0];if(!file)return;
 try{if(file.size>2*1024*1024)throw Error('分镜JSON不得大于2MB');const raw=JSON.parse(await file.text());doImport(raw)}
 catch(e){setStatus('导入失败：'+e.message+'。原镜头和素材状态保持不变。',true)}finally{$('importJSON').value=''}
});
$('batchMedia').addEventListener('change',()=>{let changed=0,skipped=[];const selected=[...$('batchMedia').files||[]];
 for(const file of selected){const matches=[...assetRegistry.values()].filter(a=>a.fileName===file.name&&a.fileName);
 if(matches.length!==1){skipped.push(file.name+'（文件名无唯一匹配项）');continue}
 try{attachLocalAsset(matches[0].id,file);changed++}catch(e){skipped.push(file.name+'（'+e.message+'）')}
 }
 choose(selectedIndex);render(t,true);refreshAssetStatus();setStatus('批量关联 '+changed+' 项；跳过 '+skipped.length+' 项'+(skipped.length?'：'+skipped.slice(0,5).join('、'):'')+'。'+(skipped.length?'请检查文件名/类型，不会模糊匹配。':''),skipped.length>0);
 $('batchMedia').value='';
});
// The original QuickTime controls live on Canvas: relay click targets to the one master timeline.
$('view').addEventListener('click',e=>{
 const r=$('view').getBoundingClientRect(),cx=(e.clientX-r.left)*1920/r.width,cy=(e.clientY-r.top)*1080/r.height;
 if(t<3.75 || t>=END)return;
 if(cy>=1009&&cy<=1080){
   if(cx>=270&&cx<=1580){const fraction=Math.max(0,Math.min(1,(cx-288)/1248));playing=false;last=0;render(fraction*END,true);$('play').textContent='▶ 播放完整样片';return}
   if(cx<125){toggle();return}
 }
 if(cx<=100&&cy<=65&&t>=CONTENT_END-0.5){playing=true;last=0;render(Math.max(t,CONTENT_END));$('play').textContent='Ⅱ 暂停'}
});
document.addEventListener('keydown',e=>{if(e.target.closest('input'))return;
 if(e.code==='Space'){e.preventDefault();toggle()}
 if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();playing=false;last=0;render(Math.max(0,Math.min(END,t+(e.code==='ArrowRight'?5:-5))),true);$('play').textContent='▶ 播放完整样片'}
});
$('fileNameEdit').addEventListener('input',e=>{FILM_CONFIG.fileName=e.target.value.trim()||'QUESTION_01.mov';render(t)});
$('sourceLabelEdit').addEventListener('input',e=>{scenes[selectedIndex].label=e.target.value;if(idx===selectedIndex)textUpdate()});
$('captionEdit').addEventListener('input',e=>{const sh=scenes[selectedIndex];sh.caption=e.target.value;if(!sh.cues.length&&e.target.value)sh.cues=[{start:0,end:sh.duration,text:e.target.value}];else if(sh.cues.length)sh.cues[0].text=e.target.value;renderCueRows();if(idx===selectedIndex){lastCueText=null;updateCueDisplay()}captionHealth()});
$('titleEdit').addEventListener('input',e=>{scenes[selectedIndex].title=e.target.value;if(idx===selectedIndex)textUpdate()});
function renderCueRows(){const root=$('cueRows'),s=scenes[selectedIndex];root.replaceChildren();(s.cues||[]).forEach((cue,i)=>{const wrap=safeEl('div','cue-row');const st=safeEl('input'),end=safeEl('input'),tx=safeEl('input'),del=safeEl('button');st.type=end.type='number';st.min=end.min='0';st.step=end.step='0.01';st.value=String(cue.start);end.value=String(cue.end);tx.type='text';tx.maxLength=100;tx.value=cue.text;st.title='开始秒';end.title='结束秒';tx.title='字幕文字';del.type='button';del.textContent='×';del.title='删除Cue';
 const update=(field,val)=>{cue[field]=val;if(i===0&&field==='text'){$('captionEdit').value=val;s.caption=val;}lastCueText=null;if(idx===selectedIndex)updateCueDisplay();captionHealth();};
 st.addEventListener('input',()=>update('start',st.value===''?NaN:Number(st.value)));end.addEventListener('input',()=>update('end',end.value===''?NaN:Number(end.value)));tx.addEventListener('input',()=>update('text',tx.value));
 del.addEventListener('click',()=>{s.cues.splice(i,1);s.caption=s.cues[0]?.text||'';$('captionEdit').value=s.caption;renderCueRows();lastCueText=null;if(idx===selectedIndex)updateCueDisplay();captionHealth()});wrap.append(st,end,tx,del);root.append(wrap)});}
$('addCue').addEventListener('click',()=>{const s=scenes[selectedIndex],end=s.cues.at(-1)?.end||0;if(end>=s.duration-.05){setStatus('当前镜头没有足够的字幕空档：请先缩短已有Cue。',true);return;}s.cues.push({start:end,end:s.duration,text:'新字幕'});renderCueRows();captionHealth();});
$('narrationStart').addEventListener('change',()=>{const val=Number($('narrationStart').value);if(!Number.isFinite(val)||val<0||val>=CONTENT_END){$('narrationStart').value=String(TRACK_CONFIG.startAt);setStatus('旁白起始秒数必须在0与内容结束时刻之间。',true);return;}TRACK_CONFIG.startAt=val;render(t);});
$('narrationFile').addEventListener('change',()=>{const file=$('narrationFile').files?.[0];if(!file)return;try{if(!/^audio\/(wav|x-wav|mpeg|ogg|mp4|webm)$/.test(file.type))throw Error('不支持该音频类型：'+file.type);const existing=TRACK_CONFIG.assetId;let id=existing;
 if(!id){id='narration_voice';for(let n=2;assetRegistry.has(id);n++)id='narration_voice_'+n;assetRegistry.set(id,{id,fileName:file.name,mimeType:file.type,rights:'UNVERIFIED',sourceRef:''});TRACK_CONFIG.assetId=id;}
 attachLocalAsset(id,file);render(t);setStatus('旁白关联成功：'+file.name+'。请在镜头Cue中明确标注每句话的起止时间。');}catch(e){setStatus(e.message,true)}finally{$('narrationFile').value=''}});
assetRegistry=initialAssetRegistry();rebuildTabs();$('narrationStart').value=String(INTRO);refreshNarrationStatus();$('fileNameEdit').value=FILM_CONFIG.fileName;choose(0);render(0,true);refreshAssetStatus();requestAnimationFrame(tick);
window.__CWS_SEEK=(x)=>{playing=false;last=0;render(x,true)};
window.__CWS_SOURCE='CWS_V55_MULTI_CUE_NARRATION_CANDIDATE';
window.__CWS_SCHEMA=()=>storyboard();
window.__CWS_IMPORT=(obj)=>doImport(obj);
window.__CWS_VALIDATE=(obj)=>{try{validateStory(obj);return {ok:true}}catch(e){return {ok:false,error:e.message}}};
window.__CWS_ASSET_STATUS=()=>({registered:assetRegistry.size,bound:imported.size,missing:[...assetRegistry.keys()].filter(id=>!imported.has(id))});
window.__CWS_CUE_STATUS=()=>({currentTime:t,shot:scenes[idx]?.id,text:$('subtitle').textContent,cueCount:scenes.reduce((sum,x)=>sum+(x.cues?.length||0),0),narrationAsset:TRACK_CONFIG.assetId,narrationReady:$('narrationAudio').readyState,narrationPaused:$('narrationAudio').paused,narrationTime:$('narrationAudio').currentTime,narrationStart:TRACK_CONFIG.startAt});
window.__CWS_DEBUG=()=>({time:t,playing,shot:scenes[idx]?.id,template:scenes[idx]?.template,step,oneOriginalCanvas:document.querySelectorAll('canvas#view').length,secondMacWindow:!!document.getElementById('qt'),end:END,shotCount:scenes.length,assetCount:assetRegistry.size,missingAssets:[...assetRegistry.keys()].filter(k=>!imported.has(k))});
})();
