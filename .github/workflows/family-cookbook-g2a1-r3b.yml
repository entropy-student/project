name: Family Cookbook G2A1-R3B Baidu handwriting fallback benchmark

on:
  push:
    branches:
      - codex/family-cookbook-g2a1-input-ocr-component-feasibility

permissions:
  contents: read

jobs:
  r3b:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/family-cookbook-g2a1-input-ocr-component-feasibility' && contains(github.event.head_commit.message, '[g2a1-r3b-run]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout the triggering branch commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install bounded R3B client dependencies
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/g2a1-r3b-venv"
          source "$RUNNER_TEMP/g2a1-r3b-venv/bin/activate"
          python -m pip install --disable-pip-version-check pip==25.2
          python -m pip install --disable-pip-version-check requests==2.32.5 Pillow==11.3.0
          python -m pip check
          python -m py_compile family-cookbook-studio/g2a1/r3b/run_baidu_benchmark.py

      - name: Run fixed 11-case Baidu handwriting benchmark
        shell: bash
        env:
          G2A1_R3B_ARTIFACT_DIR: ${{ runner.temp }}/g2a1-r3b-artifacts
          G2A1_R3B_DATA_DIR: ${{ runner.temp }}/g2a1-r3b-data
          BAIDU_OCR_API_KEY: ${{ secrets.BAIDU_OCR_API_KEY }}
          BAIDU_OCR_SECRET_KEY: ${{ secrets.BAIDU_OCR_SECRET_KEY }}
        run: |
          mkdir -p "$G2A1_R3B_ARTIFACT_DIR" "$G2A1_R3B_DATA_DIR"
          source "$RUNNER_TEMP/g2a1-r3b-venv/bin/activate"
          python family-cookbook-studio/g2a1/r3b/run_baidu_benchmark.py

      - name: Upload compact R3B structured outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: family-cookbook-g2a1-r3b-baidu-${{ github.run_id }}
          path: ${{ runner.temp }}/g2a1-r3b-artifacts/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove ephemeral R3B runtime data
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/g2a1-r3b-data" "$RUNNER_TEMP/g2a1-r3b-venv"
