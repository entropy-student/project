services:
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:8128:8025"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: birthday_magazine
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:7.0-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8127:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: birthday_magazine
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('BMS_G2A1R1_MAILPIT', true);
    volumes:
      - wp_data:/var/www/html
      - ./preview-plugin:/var/www/html/wp-content/plugins/birthday-magazine-poc:ro
      - ./mailpit-plugin:/var/www/html/wp-content/mu-plugins:ro

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: birthday_magazine
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ""
    volumes:
      - wp_data:/var/www/html
      - ./preview-plugin:/var/www/html/wp-content/plugins/birthday-magazine-poc:ro
      - ./packages:/tmp/g2a1-packages:ro

volumes:
  db_data:
  wp_data:
