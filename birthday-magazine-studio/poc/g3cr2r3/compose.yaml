name: birthday-magazine-g3cr2r3

services:
  db:
    image: mariadb:11.4.7
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: wordpress
    volumes:
      - database:/var/lib/mysql
    networks:
      - private
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    image: wordpress:7.1.1-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "127.0.0.1:8187:80"
    volumes:
      - wordpress:/var/www/html
      - ../g3a/wordpress/.htaccess:/var/www/html/.htaccess:ro
      - ../g3a/commerce-workspace-plugin:/var/www/html/wp-content/plugins/bms-g3a-commerce-loop:ro
    networks:
      - private

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: ""
      WORDPRESS_DB_NAME: wordpress
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli/cache
    volumes:
      - wordpress:/var/www/html
      - ../g3a/wordpress/.htaccess:/var/www/html/.htaccess:ro
      - ../g3a/commerce-workspace-plugin:/var/www/html/wp-content/plugins/bms-g3a-commerce-loop:ro
    networks:
      - private

volumes:
  database:
    name: birthday-magazine-g3cr2r3_database
  wordpress:
    name: birthday-magazine-g3cr2r3_wordpress

networks:
  private:
    name: birthday-magazine-g3cr2r3_private
    driver: bridge
