map $http_upgrade $spw_connection {
    default upgrade;
    '' '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The original gateway remains responsible for upload/request limits.
    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $spw_connection;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Named redirects preserve the original request method and body.
    error_page 418 = @gateway;

    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Only known application pages get the SPA. Unknown/provider/plugin URLs
    # continue to the official gateway, including nonstandard native endpoints.
    location ~ ^/(dashboard|models|pricing|oauth|usage-logs|system-settings|chat|console|task-plugins|errors)(/|$) {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/(sign-in|sign-up|register|login|forgot-password|reset|user/reset|otp|privacy-policy|user-agreement|rankings|about|setup|keys|channels|playground|chat2link|profile|security|wallet|users|subscriptions|redemption-codes|system-info|forbidden|401|403|404|500|503)/?$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /static/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /spw/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        add_header Cache-Control "no-cache";
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 418; }
        try_files $uri @gateway;
    }

    location @gateway {
        proxy_pass http://new-api:3000;
    }
}
